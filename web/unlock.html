<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f2f0eb" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141312" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="sounder">
<title>sounder — 合言葉</title>
<link rel="apple-touch-icon" href="/icon-180.png">
<link rel="icon" href="/favicon.png" sizes="64x64" type="image/png">
<!-- フォントとアイコンは合言葉なしでも配られる（sounder/server.py の _public） -->
<style>
  @font-face { font-family: "M PLUS Rounded 1c"; font-weight: 400; font-display: swap; src: url("/fonts/MPLUSRounded1c-Regular.woff2") format("woff2"); }
  @font-face { font-family: "M PLUS Rounded 1c"; font-weight: 700; font-display: swap; src: url("/fonts/MPLUSRounded1c-Bold.woff2") format("woff2"); }
  :root {
    --bg: #f2f0eb; --surface: #fff; --fill: #efece6; --ink: #1e1d1a; --ink-2: #6b6862;
    --ink-off: #a19c94; --accent: #b4551f; --accent-soft: #f6e6da; --err: #a63232;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141312; --surface: #1f1e1c; --fill: #2a2825; --ink: #eceae6; --ink-2: #9d9a94;
      --ink-off: #6a665f; --accent: #e08a4e; --accent-soft: #3a2a1c; --err: #ef8a8a;
    }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; background: var(--bg); }
  body {
    margin: 0; min-height: 100vh; min-height: 100dvh;
    display: flex; flex-direction: column; justify-content: center;
    padding: calc(24px + env(safe-area-inset-top, 0px)) calc(16px + env(safe-area-inset-right, 0px))
             calc(24px + env(safe-area-inset-bottom, 0px)) calc(16px + env(safe-area-inset-left, 0px));
    background: var(--bg); color: var(--ink);
    font: 17px/1.45 "M PLUS Rounded 1c", -apple-system, BlinkMacSystemFont, "Hiragino Sans", sans-serif;
    word-break: auto-phrase; line-break: strict;
    -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent;
  }
  form { width: 100%; max-width: 400px; margin: 0 auto; }
  .tile {
    width: 64px; height: 64px; margin: 0 auto 14px; border-radius: 16px;
    display: flex; align-items: center; justify-content: center;
    background: var(--accent-soft); color: var(--accent);
  }
  h1 { margin: 0 0 6px; font-size: 26px; font-weight: 700; text-align: center; }
  .lead { margin: 0 16px 22px; font-size: 14px; color: var(--ink-2); text-align: center; }
  .ph { display: inline-block; max-width: 100%; }
  .group { background: var(--surface); border-radius: 14px; overflow: hidden; }
  input {
    display: block; width: 100%; min-height: 52px; padding: 0 16px; border: 0;
    background: none; color: var(--ink); font: inherit; font-size: 17px; text-align: center;
  }
  input::placeholder { color: var(--ink-off); }
  input:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; border-radius: 14px; }
  button {
    display: block; width: 100%; min-height: 50px; margin-top: 14px; border: 0; border-radius: 14px;
    background: var(--accent); color: #fff; font: inherit; font-size: 17px; font-weight: 700;
    cursor: pointer; -webkit-tap-highlight-color: transparent; touch-action: manipulation;
  }
  button:active { opacity: .7; }
  .err { margin: 12px 16px 0; font-size: 14px; font-weight: 700; color: var(--err); text-align: center; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<form id="f">
  <div class="tile" aria-hidden="true">
    <svg viewBox="0 0 24 24" width="32" height="32" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 16v-5a6 6 0 0 1 12 0v5l2 2H4z"/><path d="M10 21h4"/></svg>
  </div>
  <h1>合言葉を入れてください</h1>
  <p class="lead"><span class="ph">この Mac で sounder を起動したときに</span><span class="ph">表示された合言葉です。</span>
     <span class="ph">一度入れると、</span><span class="ph">このブラウザは覚えます。</span></p>
  <div class="group">
    <input type="password" id="t" autocomplete="current-password" inputmode="text"
           placeholder="合言葉" aria-label="合言葉" autofocus>
  </div>
  <button type="submit">開く</button>
  <p class="err" id="e" role="alert" hidden><span class="ph">合言葉が違うようです。</span><span class="ph">もう一度お試しください。</span></p>
</form>
<script>
  var q = new URLSearchParams(location.search);
  if (q.get('t')) document.getElementById('e').hidden = false;
  document.getElementById('f').addEventListener('submit', function (ev) {
    ev.preventDefault();
    var v = document.getElementById('t').value.trim();
    if (v) location.href = '/?t=' + encodeURIComponent(v);
  });
</script>
</body>
</html>
