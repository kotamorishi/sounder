<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>sounder — 合言葉</title>
<link rel="apple-touch-icon" href="/icon-180.png">
<style>
  :root { --bg: #f7f6f3; --surface: #fff; --line: #e2dfd8; --ink: #1c1b18; --ink-2: #6d6a63; --accent: #b4551f; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #151618; --surface: #1e2023; --line: #33373d; --ink: #edebe7; --ink-2: #a19e97; --accent: #e08a4e; }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px;
    background: var(--bg); color: var(--ink);
    font: 15px/1.6 -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", sans-serif;
  }
  .card {
    background: var(--surface); border: 1px solid var(--line); border-radius: 16px;
    padding: 26px 22px; width: min(400px, 100%); display: grid; gap: 14px; text-align: center;
  }
  .mark { font-size: 40px; line-height: 1; }
  h1 { font-size: 17px; margin: 0; }
  p { margin: 0; font-size: 13.5px; color: var(--ink-2); }
  input {
    font: inherit; font-size: 16px; text-align: center; width: 100%;
    padding: 12px; border-radius: 10px; border: 1px solid var(--line);
    background: var(--bg); color: var(--ink);
  }
  button {
    font: inherit; font-size: 15px; font-weight: 600; cursor: pointer; width: 100%;
    padding: 12px; border-radius: 10px; border: 0; background: var(--accent); color: #fff;
  }
  .err { color: #a63232; font-size: 13px; }
</style>
</head>
<body>
<form class="card" id="f">
  <div class="mark" aria-hidden="true">🔔</div>
  <h1>合言葉を入れてください</h1>
  <p>この Mac で sounder を起動したときに表示された合言葉です。<br>
     一度入れると、このブラウザは覚えます。</p>
  <input type="password" id="t" autocomplete="current-password" inputmode="text"
         placeholder="合言葉" autofocus>
  <button type="submit">開く</button>
  <p class="err" id="e" hidden>合言葉が違うようです。もう一度お試しください。</p>
</form>
<script>
  var q = new URLSearchParams(location.search);
  if (q.get('t')) document.getElementById('e').hidden = false;
  document.getElementById('f').addEventListener('submit', function (ev) {
    ev.preventDefault();
    var v = document.getElementById('t').value.trim();
    if (v) location.href = '/?t=' + encodeURIComponent(v);
  });
</script>
</body>
</html>
